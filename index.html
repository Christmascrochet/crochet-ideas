<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Crochet Ideas &amp; Crochet Christmas Gifts </title>
<meta name="description" content="Browse Christmas crochet ideas one by one: snowmen, reindeer, gnomes, ornaments and handmade crochet Christmas gifts. Tap any project to open its full guide.">
<meta name="keywords" content="Christmas crochet, Christmas crochet ideas, crochet Christmas gifts, crochet Christmas ornaments">
<!-- TODO: replace YOUR-DOMAIN.com with your bridge site domain -->
<link rel="canonical" href="https://christmascrochet.github.io/crochet-ideas/">
<meta property="og:title" content="Christmas Crochet Ideas &amp; Crochet Christmas Gifts">
<meta property="og:description" content="Tap any crochet project to open its full guide.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://refinedhook.com/images/blog/christmas-crochet-ideas.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf6ee;--paper:#fff;--red:#b3262e;--red-dark:#8f1d24;--green:#1f4d3a;--ink:#2a2420;--muted:#6d625a;--line:#eadfce}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header.top{padding:16px 0;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{font-family:'Playfair Display',serif;font-weight:700;font-size:1.25rem;color:var(--green)}
.hero{text-align:center;padding:42px 0 22px}
.eyebrow{display:inline-block;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:12px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,5.5vw,3rem);line-height:1.15;color:var(--green);margin-bottom:12px}
.hero p{max-width:600px;margin:0 auto;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:24px 0 26px}
.filters button{font:inherit;font-size:.88rem;font-weight:500;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer}
.filters button:hover{border-color:var(--red);color:var(--red)}
.filters button.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-bottom:50px}
.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s,box-shadow .2s;scroll-margin-top:20px}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(60,40,20,.12)}
.card:target{outline:3px solid var(--red)}
.card .pic{aspect-ratio:1/1;background:#efe6d6;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover img{transform:scale(1.04)}
.card .txt{padding:14px 14px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h2{font-family:'Playfair Display',serif;font-size:1.05rem;line-height:1.3;color:var(--green)}
.card .src{font-size:.76rem;color:var(--muted)}
.card .go{margin-top:auto;padding-top:8px;font-size:.85rem;font-weight:600;color:var(--red)}
.card.hide{display:none}
footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:.85rem;color:var(--muted);background:var(--paper)}
footer a{color:var(--red)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card h2{font-size:.95rem}}
</style>
</head>
<body>

<header class="top">
  
</header>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow">Holiday crochet</span>
    <h1>Christmas Crochet Ideas &amp; Crochet Christmas Gifts</h1>
    <p>Tap any project to open the full guide where you will find it.</p>
  </section>

  <div class="filters" id="filters">
    <button class="on" data-f="all">All projects</button>
    <button data-f="ideas">Christmas Crochet Ideas</button>
    <button data-f="ornaments">Crochet Ornaments</button>
    <button data-f="gifts">Crochet Christmas Gifts</button>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="wrap"> Crochet patterns, ideas and guides</div>
</footer>

<script>
/* ============ EDIT HERE ============
   To add a toy: copy a line, change id, title, img, article and find.
   id      = anchor on this page (yourdomain.com/#id), handy for pin links
   img     = file name in refinedhook.com/images/blog/ (without .jpg)
   article = ideas | ornaments | gifts
   find    = start of the heading inside the article (the page scrolls to it)
*/
const BASE = "https://refinedhook.com/articles/";
const UTM  = "?utm_source=pinterest&utm_medium=social&utm_campaign=bridge";
const ARTICLES = {
  ideas:     { slug: "christmas-crochet-ideas",    name: "Christmas Crochet Ideas" },
  ornaments: { slug: "crochet-christmas-ornaments", name: "Crochet Christmas Ornaments" },
  gifts:     { slug: "crochet-christmas-gifts",     name: "Crochet Christmas Gifts" }
};
const ITEMS = [
  // --- Christmas Crochet Ideas ---
  { id:"mini-snowman",        title:"Mini Snowman",                 img:"mini-crochet-snowman",              article:"ideas", find:"1. Mini Snowman" },
  { id:"ornament-set",        title:"Christmas Tree Ornament Set",  img:"christmas-crochet-ornament-set",    article:"ideas", find:"2. Christmas Tree Ornament Set" },
  { id:"mini-trees",          title:"Mini Christmas Trees",         img:"mini-crochet-christmas-trees",      article:"ideas", find:"3. Mini Christmas Trees" },
  { id:"snowflakes",          title:"Crochet Snowflakes",           img:"crochet-christmas-snowflakes",      article:"ideas", find:"4. Crochet Snowflakes" },
  { id:"reindeer-sweater",    title:"Reindeer in a Sweater",        img:"crochet-reindeer-sweater",          article:"ideas", find:"5. Reindeer in a Sweater" },
  { id:"car-with-tree",       title:"Car with a Christmas Tree",    img:"crochet-christmas-car-tree",        article:"ideas", find:"6. Car with a Christmas Tree" },
  { id:"santa-hat",           title:"Mini Santa Hat Ornaments",     img:"mini-crochet-santa-hat-ornaments",  article:"ideas", find:"7. Mini Santa Hat" },
  { id:"reindeer-rattle",     title:"Reindeer Rattle",              img:"crochet-reindeer-rattle",           article:"ideas", find:"8. Reindeer Rattle" },
  { id:"santa-gnome",         title:"Santa Gnome",                  img:"crochet-santa-gnome",               article:"ideas", find:"9. Santa Gnome" },
  { id:"bunny-santa",         title:"Bunny in a Santa Hat and Sweater", img:"crochet-bunny-santa-hat-sweater", article:"ideas", find:"10. Bunny in a Santa Hat" },
  // --- Crochet Christmas Ornaments ---
  { id:"ornament-bundle",     title:"Classic Ornament Bundle",      img:"classic-crochet-christmas-ornament-bundle", article:"ornaments", find:"1. Classic Ornament Bundle" },
  { id:"gingerbread-man",     title:"Gingerbread Man",              img:"crochet-gingerbread-man-ornament",  article:"ornaments", find:"2. Gingerbread Man" },
  { id:"candy-cane",          title:"Striped Candy Cane with Holly",img:"crochet-candy-cane-holly-ornament", article:"ornaments", find:"3. Striped Candy Cane" },
  { id:"tree-applique",       title:"Christmas Tree Appliqué",      img:"crochet-christmas-tree-applique-ornament", article:"ornaments", find:"5. Christmas Tree Appli" },
  // duplicates that also appear in the Ornaments article
  { id:"ornaments-gnome",     title:"Santa Gnome",                  img:"crochet-santa-gnome-ornament",      article:"ornaments", find:"4. Santa Gnome" },
  { id:"ornaments-santa-hat", title:"Mini Santa Hat",               img:"mini-crochet-santa-hat-ornaments",  article:"ornaments", find:"6. Mini Santa Hat" },
  { id:"ornaments-snowflakes",title:"Lacy Snowflakes",              img:"lacy-crochet-snowflake-ornaments",  article:"ornaments", find:"7. Lacy Snowflakes" },
  { id:"ornaments-set",       title:"Tree-Ready Ornament Set",      img:"christmas-crochet-ornament-set",    article:"ornaments", find:"8. Tree-Ready Ornament Set" },
  { id:"ornaments-snowman",   title:"Snowman",                      img:"mini-crochet-snowman",              article:"ornaments", find:"9. Snowman" },
  // --- Crochet Christmas Gifts ---
  { id:"cream-reindeer",      title:"Cream Reindeer",               img:"cream-crochet-reindeer",            article:"gifts", find:"1. Cream Reindeer" },
  { id:"gifts-gnome",         title:"Santa Gnome",                  img:"crochet-santa-gnome",               article:"gifts", find:"2. Santa Gnome" },
  { id:"gifts-bunny",         title:"Bunny in a Santa Hat",         img:"crochet-bunny-santa-hat",           article:"gifts", find:"3. Bunny in a Santa Hat" },
  { id:"moose",               title:"Moose",                        img:"crochet-moose",                     article:"gifts", find:"4. Moose" },
  { id:"reindeer-dress",      title:"Reindeer in a Christmas Dress",img:"crochet-reindeer-christmas-dress",  article:"gifts", find:"5. Reindeer in a Christmas Dress" },
  { id:"sheep",               title:"Sheep",                        img:"crochet-sheep-symbol-of-the-year",  article:"gifts", find:"6. Sheep" },
  { id:"glowing-reindeer",    title:"Glowing Reindeer",             img:"glowing-crochet-reindeer",          article:"gifts", find:"7. Glowing Reindeer" },
  { id:"goat",                title:"Goat",                         img:"crochet-goat-symbol-of-the-year",   article:"gifts", find:"8. Goat" },
  { id:"santa-pants-basket",  title:"Santa's Pants Basket",         img:"crochet-santa-pants-basket",        article:"gifts", find:"9. Crochet Santa" },
  { id:"mug-sleeves",         title:"Cozy Mug Sleeves",             img:"crochet-cozy-mug-sleeves",          article:"gifts", find:"10. Cozy Mug Sleeves" }
];

const grid = document.getElementById("grid");
ITEMS.forEach(it => {
  const a = ARTICLES[it.article];
  const href = BASE + a.slug + ".html" + UTM + "#:~:text=" + encodeURIComponent(it.find);
  const el = document.createElement("a");
  el.className = "card";
  el.id = it.id;
  el.dataset.cat = it.article;
  el.href = href;
  el.innerHTML =
    '<div class="pic"><img loading="lazy" src="https://refinedhook.com/images/blog/' + it.img + '.jpg" alt="Crochet ' + it.title.replace(/"/g,"") + '"></div>' +
    '<div class="txt"><h2>' + it.title + '</h2>' +
    '<span class="src">From: ' + a.name + '</span>' +
    '<span class="go">View this project →</span></div>';
  grid.appendChild(el);
});

document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x === b));
  const f = b.dataset.f;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("hide", f !== "all" && c.dataset.cat !== f));
});
document.getElementById("y").textContent = new Date().getFullYear();
</script>
</body>
</html>
